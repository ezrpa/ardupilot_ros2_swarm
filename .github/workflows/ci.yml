name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, architecture contracts, types, tests (no ROS)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # same as the ROS 2 Humble / ArduPilot images
      - name: Install tools and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9 import-linter==2.1 mypy==1.11.2 pytest \
            numpy opencv-python-headless pytak==7.6.1
      - name: ruff (undefined / unused names)
        run: ruff check .
      - name: import-linter (layers, ROS only in nodes, stdlib-only core)
        run: PYTHONPATH=src/swarm_control lint-imports
      - name: mypy (contract layer)
        working-directory: src/swarm_control
        run: mypy --config-file ../../mypy.ini -p swarm_control.core
      - name: pytest (unit, contracts, golden masters)
        run: python -m pytest

  ros:
    name: colcon build + ROS tests in the swarm_controller image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build swarm_controller image (cached)
        uses: docker/build-push-action@v6
        with:
          context: src/dockerfiles
          file: src/dockerfiles/Dockerfile.ros2
          tags: swarm_controller:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build package, check install layout, smoke executables, pytest
        run: |
          docker run --rm -v "$PWD":/repo:ro --entrypoint bash \
            swarm_controller:ci /repo/tools/ci/container_checks.sh
