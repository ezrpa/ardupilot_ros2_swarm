[pytest]
testpaths = tests
# The host's ROS build registers a launch_testing pytest plugin that needs
# `lark` (and launch_ros depends on it); this suite uses neither.
addopts = -p no:launch_testing -p no:launch_ros -ra
markers =
    ros: needs rclpy + ardupilot_msgs (run inside the swarm_controller image); auto-skipped elsewhere
    sim: needs a running swarm / TAK viewer; skipped unless --sim is given
