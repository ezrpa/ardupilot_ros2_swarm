x-common-settings: &common-settings
  ipc: host  #shares the host’s shared memory mechanism with the containers.
  pid: host
  privileged: true
  restart: unless-stopped
#  volumes:
#    - /dev/shm:/dev/shm
#    - /dev:/dev
#    - ./config:/config

services:

  discovery_server:
    <<: *common-settings
    image: osrf/ros:humble-desktop
    container_name: discovery_server
    network_mode: host
    ports:
      - "11888:11888"
    restart: unless-stopped
#    networks:
#      swarm_network:
#        ipv4_address: 172.20.0.10
#    stdin_open: true
#    tty: true
#    command: [ "/bin/bash" ]
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        fastdds discovery -i 0 -l 172.20.0.10 -p 11811
      "

  swarm_controller:
    <<: *common-settings
    build:
      context: ./src/dockerfiles
      dockerfile: Dockerfile.ros2
    container_name: swarm_controller
    # It ensures that signals sent to the Docker container are correctly propagated to the application process running inside
    init: true
    network_mode: host
    environment:
      - NUM_DRONES=${NUM_DRONES:-2}
      # Space-separated 0-indexed instances flying the sprayer role
      - SPRAYER_INSTANCES=${SPRAYER_INSTANCES:-}
      # Mission: "survey" (default) or "sar" (search and rescue)
      - SWARM_MISSION=${SWARM_MISSION:-survey}
      # TAK / Cursor-on-Target bridge (docs/TAK.md). Empty TAK_URL = off.
      # Cert paths are inside the container: put PEMs in ./tak on the host.
      - TAK_URL=${TAK_URL:-}
      - TAK_CERT=${TAK_CERT:-}
      - TAK_KEY=${TAK_KEY:-}
      - TAK_KEY_PASSWORD=${TAK_KEY_PASSWORD:-}
      - TAK_CA=${TAK_CA:-}
      - TAK_VIDEO_URL=${TAK_VIDEO_URL:-}
      - TAK_GEOID_OFFSET=${TAK_GEOID_OFFSET:-}
      - TAK_UID_PREFIX=${TAK_UID_PREFIX:-}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      #- ROS_DISCOVERY_SERVER=172.20.0.10:11888
    volumes:
      - ./src/swarm_control:/ros2_ws/src/swarm_control
      - ./logs:/root/logs:delegated
      - ./src/scripts:/root/scripts:ro
      - ./src/dockerfiles/config:/root/config:ro
      - ./tak:/root/tak:ro
#    stdin_open: true
#    tty: true
#    command: [ "/bin/bash" ]
    command: [ "/root/scripts/start_swarm_controller.sh" ]
    depends_on:
      - discovery_server

  drone_ardu:
    profiles: ["manual"]
    build:
      context: ./src/dockerfiles
      dockerfile: Dockerfile.ardupilot
    network_mode: host
    tty: true #needed for mavproxy to run in non-interactive mode
    environment:
      - INSTANCE=${INSTANCE:-0}
      - NUM_DRONES=${NUM_DRONES:-2}
      - SYSID_THISMAV=${SYSID_THISMAV:-1}
      - MICRO_ROS_AGENT_PORT=${MICRO_ROS_AGENT_PORT:-2019}
 #     - ROS_DISCOVERY_SERVER=172.20.0.10:11888
    volumes:
      - ./src/swarm_control/parameters:/config
      - ./src/scripts:/root/scripts:ro
    command: ["/root/scripts/start_drone_container.sh"]


  micro-ros-agent-drone:
    <<: *common-settings
    profiles: ["manual"]
    build:
      context: ./src/dockerfiles
      dockerfile: Dockerfile.dds-agent
    network_mode: host
    restart: unless-stopped
    environment:
      - INSTANCE=${INSTANCE:-0}
      - NUM_DRONES=${NUM_DRONES:-2}
      - MICRO_ROS_AGENT_DISCOVERY_TIMEOUT=10
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-1}
      - MICRO_ROS_AGENT_PORT=${MICRO_ROS_AGENT_PORT:-2019}
    volumes:
      - ./src/scripts:/root/scripts:ro
    entrypoint: ["/bin/bash"]
    command: ["/root/scripts/start_micro_ros_agent_drone.sh"]
